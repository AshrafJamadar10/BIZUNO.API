spring.application.name=BIZUNO.API

# DataSource is configured in DatabaseInitializer.java
# spring.datasource.* properties removed to prevent autoconfiguration before database creation

#db config
db.username=${DB_USERNAME}
db.password=${DB_PASSWORD}
db.name=${DB_NAME}


#Tenant Database
admin.datasource.db=${ADMIN_DB_NAME}
admin.datasource.username=${ADMIN_DB_USERNAME}
admin.datasource.password=${ADMIN_DB_PASSWORD}

database.host=${DB_HOST}
database.port=${DB_PORT}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.generate-ddl=false
spring.jpa.packages-to-scan=com.bizuno.models.main

spring.jpa.properties.hibernate.attribute_converter_apply=false

spring.jpa.hibernate.naming.implicit-strategy=org.hibernate.boot.model.naming.ImplicitNamingStrategyJpaCompliantImpl
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy

business.datasource.url = jdbc:postgresql://${DB_HOST}:${DB_PORT}/

# Swagger Configuration
swagger.enabled=true
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true

# Package to scan for APIs
springdoc.packages-to-scan=com.bizuno.controllers.business,com.bizuno.controllers.main

# Packages to scan for models
packages-to-scan.main=com.bizuno.models.main
packages-to-scan.business=com.bizuno.models.business

#JWT Configuration
jwt.secret=${JWT_SECRET:BizUno-JWT-2026-9fK7mQ2xV8pL4zN6cR1tY5wH3jA8sD0fG2kM7nP9qX4bZ6vC1}
jwt.access.expiration=86400000
jwt.refresh.expiration=604800000

system.super-admin.email=${SUPER_ADMIN_EMAIL:superadmin@bizuno.com}
system.super-admin.phone=${SUPER_ADMIN_PHONE:9876543210}
system.super-admin.password=${SUPER_ADMIN_PASSWORD:Bizuno@123}

spring.config.import=optional:file:.env[.properties]