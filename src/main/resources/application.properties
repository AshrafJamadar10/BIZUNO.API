spring.application.name=BIZUNO.API

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:tenant_main_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

#Tenant Database
admin.datasource.db=${ADMIN_DB_NAME}
admin.datasource.username=${ADMIN_DB_USERNAME}
admin.datasource.password=${ADMIN_DB_PASSWORD}

database.host=${DB_HOST}
database.port=${DB_PORT}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.generate-ddl=false
spring.jpa.packages-to-scan=com.bizuno.models.main

spring.jpa.properties.hibernate.attribute_converter_apply=false

spring.jpa.hibernate.naming.implicit-strategy=org.hibernate.boot.model.naming.ImplicitNamingStrategyJpaCompliantImpl
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy

business.datasource.url = jdbc:postgresql://${DB_HOST}:${DB_PORT}/

# Swagger Configuration
swagger.enabled=true
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true

# Package to scan for APIs
springdoc.packages-to-scan=com.bizuno.controllers.business,com.bizuno.controllers.main

# Packages to scan for models
packages-to-scan.main=com.bizuno.models.main
packages-to-scan.business=com.bizuno.models.business

spring.config.import=optional:file:.env[.properties]